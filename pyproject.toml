[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["synth_market*"]

[project]
name = "synth_market"
version = "0.2.1"
description = "Synthetic tick-level market simulator for strategy testing"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]
